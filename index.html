<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARKDOWN//LAB — Loading P5</title><style>html{color-scheme:dark;background:#0d1117;color:#e6edf3;font:16px/1.5 system-ui}body{max-width:720px;margin:12vh auto;padding:24px}code{font-family:monospace;color:#58a6ff}.err{border-left:4px solid #f85149;padding-left:14px}.bar{height:6px;background:#161b22;border:1px solid #30363d;margin-top:18px}.bar>i{display:block;height:100%;width:0;background:#2f81f7;transition:width .15s}</style></head><body><h1>MARKDOWN//LAB</h1><p id="status">Loading the P5 Mermaid & diagram laboratory…</p><div class="bar" aria-hidden="true"><i id="progress"></i></div><noscript><p class="err">JavaScript is required for the interactive laboratory.</p></noscript><script>
(async()=>{try{
 if(!('DecompressionStream' in globalThis))throw new Error('This browser does not support DecompressionStream.');
 const paths=Array.from({length:10},(_,i)=>`assets/p5/runtime/payload-${String(i+1).padStart(2,'0')}.txt`),parts=[];
 for(let i=0;i<paths.length;i++){const r=await fetch(paths[i],{cache:'force-cache'});if(!r.ok)throw new Error(`Payload ${i+1} failed (${r.status}).`);parts.push((await r.text()).trim());progress.style.width=`${((i+1)/paths.length)*75}%`;status.textContent=`Loading P5 runtime… ${i+1}/${paths.length}`}
 const p=parts.join('');if(p.length!==58292)throw new Error(`Payload integrity check failed (${p.length}/58292).`);
 const bytes=Uint8Array.from(atob(p),c=>c.charCodeAt(0));progress.style.width='85%';
 const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
 const html=await new Response(stream).text();progress.style.width='100%';
 document.open();document.write(html);document.close();
}catch(e){document.body.innerHTML='<h1>MARKDOWN//LAB</h1><p class="err">P5 could not initialize: '+String(e.message||e)+'</p>'}})();
</script></body></html>
