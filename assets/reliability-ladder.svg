<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Media reliability ladder</title>
  <desc id="desc">A diagram comparing external image generators, repository-owned raster assets, and repository-owned SVG assets.</desc>
  <rect width="1200" height="240" rx="24" fill="#111827"/>
  <text x="50" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#a78bfa">MEDIA RELIABILITY LADDER</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="50" y="78" width="325" height="110" rx="18" fill="#1f2937" stroke="#475569"/>
    <text x="74" y="112" font-size="20" font-weight="700" fill="#f8fafc">External generator</text>
    <text x="74" y="142" font-size="16" fill="#cbd5e1">Fast to add · third-party dependency</text>
    <text x="74" y="168" font-size="15" fill="#94a3b8">Useful demo, weaker infrastructure</text>

    <rect x="438" y="78" width="325" height="110" rx="18" fill="#1f2937" stroke="#475569"/>
    <text x="462" y="112" font-size="20" font-weight="700" fill="#f8fafc">Local raster</text>
    <text x="462" y="142" font-size="16" fill="#cbd5e1">Versioned · predictable pixels</text>
    <text x="462" y="168" font-size="15" fill="#94a3b8">Great for screenshots and photos</text>

    <rect x="826" y="78" width="325" height="110" rx="18" fill="#172554" stroke="#22d3ee" stroke-width="2"/>
    <text x="850" y="112" font-size="20" font-weight="700" fill="#f8fafc">Local SVG</text>
    <text x="850" y="142" font-size="16" fill="#cbd5e1">Versioned · scalable · themeable pair</text>
    <text x="850" y="168" font-size="15" fill="#67e8f9">Ideal for README interface graphics</text>
  </g>
</svg>