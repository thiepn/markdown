<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">Fallback aware picture element diagram</title>
  <desc id="desc">A diagram showing dark source, light source, and fallback image flowing into the picture element.</desc>
  <rect width="720" height="180" rx="20" fill="#f8fafc"/>
  <text x="36" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#7c3aed">PICTURE FALLBACK CHAIN</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">
    <rect x="36" y="66" width="160" height="56" rx="12" fill="#0f172a"/><text x="116" y="99" fill="#f8fafc">dark source</text>
    <rect x="280" y="66" width="160" height="56" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="360" y="99" fill="#0f172a">light source</text>
    <rect x="524" y="66" width="160" height="56" rx="12" fill="#ede9fe" stroke="#8b5cf6"/><text x="604" y="99" fill="#4c1d95">fallback &lt;img&gt;</text>
  </g>
  <path d="M198 94h74" stroke="#64748b" stroke-width="2"/><path d="M266 88l8 6-8 6" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M442 94h74" stroke="#64748b" stroke-width="2"/><path d="M510 88l8 6-8 6" fill="none" stroke="#64748b" stroke-width="2"/>
</svg>