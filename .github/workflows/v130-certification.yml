name: v1.3.0 Learning Certification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository learning certification
        run: node scripts/v130-certify.mjs

      - name: Resolve Chromium
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BIN" ]; then
            echo "No Chromium-family browser is installed on the runner" >&2
            exit 1
          fi
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          "$BIN" --version

      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/markdown-lab-v130-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then exit 0; fi
            sleep 0.2
          done
          cat /tmp/markdown-lab-v130-server.log
          exit 1

      - name: Desktop learning certification
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.bin }}
        run: |
          set -euo pipefail
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,1000 --virtual-time-budget=60000 --dump-dom 'http://127.0.0.1:8000/?v130-ci=1' > /tmp/v130-desktop.html
          grep -q 'id="v130CiResult"' /tmp/v130-desktop.html
          grep -q 'data-status="pass"' /tmp/v130-desktop.html
          grep -q 'V130_LEARNING_CERTIFIED' /tmp/v130-desktop.html

      - name: Mobile learning certification
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.bin }}
        run: |
          set -euo pipefail
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=375,812 --force-device-scale-factor=1 --virtual-time-budget=60000 --dump-dom 'http://127.0.0.1:8000/?v130-ci=1' > /tmp/v130-mobile.html
          grep -q 'id="v130CiResult"' /tmp/v130-mobile.html
          grep -q 'data-status="pass"' /tmp/v130-mobile.html
          grep -q 'V130_LEARNING_CERTIFIED' /tmp/v130-mobile.html

      - name: Emit learning summary
        if: always()
        shell: bash
        run: |
          echo '## v1.3.0 Guided Learning Certification' >> "$GITHUB_STEP_SUMMARY"
          [ -f artifacts/v130-static-report.json ] && cat artifacts/v130-static-report.json >> "$GITHUB_STEP_SUMMARY" || true
          [ -f /tmp/v130-desktop.html ] && echo '- Desktop learning DOM generated.' >> "$GITHUB_STEP_SUMMARY" || true
          [ -f /tmp/v130-mobile.html ] && echo '- Mobile learning DOM generated.' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload learning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v130-learning-certification-evidence
          path: |
            artifacts/v130-static-report.json
            /tmp/v130-desktop.html
            /tmp/v130-mobile.html
            /tmp/markdown-lab-v130-server.log
          if-no-files-found: warn
