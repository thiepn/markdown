name: v1.4.0 Mastery Certification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-mastery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository mastery certification
        run: node scripts/v140-certify.mjs

      - name: Resolve Chromium
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BIN" ]; then
            echo "No Chromium-family browser is installed on the runner" >&2
            exit 1
          fi
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          "$BIN" --version

      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/markdown-lab-v140-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then exit 0; fi
            sleep 0.2
          done
          cat /tmp/markdown-lab-v140-server.log
          exit 1

      - name: Desktop mastery certification
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.bin }}
        run: |
          set -euo pipefail
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,1000 --virtual-time-budget=60000 --dump-dom 'http://127.0.0.1:8000/?v140-ci=1' > /tmp/v140-desktop.html
          grep -q 'id="v140CiResult"' /tmp/v140-desktop.html
          grep -q 'data-status="pass"' /tmp/v140-desktop.html
          grep -q 'V140_MASTERY_CERTIFIED' /tmp/v140-desktop.html

      - name: Mobile mastery certification
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.bin }}
        run: |
          set -euo pipefail
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=375,812 --force-device-scale-factor=1 --virtual-time-budget=60000 --dump-dom 'http://127.0.0.1:8000/?v140-ci=1' > /tmp/v140-mobile.html
          grep -q 'id="v140CiResult"' /tmp/v140-mobile.html
          grep -q 'data-status="pass"' /tmp/v140-mobile.html
          grep -q 'V140_MASTERY_CERTIFIED' /tmp/v140-mobile.html

      - name: Emit mastery summary
        if: always()
        shell: bash
        run: |
          echo '## v1.4.0 Mastery & Review Certification' >> "$GITHUB_STEP_SUMMARY"
          [ -f artifacts/v140-static-report.json ] && cat artifacts/v140-static-report.json >> "$GITHUB_STEP_SUMMARY" || true
          [ -f /tmp/v140-desktop.html ] && echo '- Desktop mastery DOM generated.' >> "$GITHUB_STEP_SUMMARY" || true
          [ -f /tmp/v140-mobile.html ] && echo '- Mobile mastery DOM generated.' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload mastery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v140-mastery-certification-evidence
          path: |
            artifacts/v140-static-report.json
            /tmp/v140-desktop.html
            /tmp/v140-mobile.html
            /tmp/markdown-lab-v140-server.log
          if-no-files-found: warn
